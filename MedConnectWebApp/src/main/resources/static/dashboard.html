<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - MedConnect</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app">
<main>
  <h1>Dashboard</h1>
  <div class="grid">
    <div class="card"><div>Pacientes</div><div class="num" id="nPac">0</div></div>
    <div class="card"><div>Médicos</div><div class="num" id="nMed">0</div></div>
    <div class="card"><div>Consultas futuras</div><div class="num" id="nCon">0</div></div>
  </div>
  <div class="card"><h2>Próximas consultas</h2>
    <div class="tbl"><table><thead><tr><th>Data/hora</th><th>Paciente</th><th>Médico</th></tr></thead><tbody id="proximas"></tbody></table></div>
  </div>
</main>
<script src="js/validacoes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
