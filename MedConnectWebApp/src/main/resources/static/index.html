<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - MedConnect</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login">
<form id="login" class="box" novalidate>
  <h1>MedConnect</h1>
  <div><label for="email">E-mail</label><input type="email" id="email" data-rule="required,email" placeholder="usuario@exemplo.com"><span class="erro"></span></div>
  <div><label for="senha">Senha</label><input type="password" id="senha" data-rule="senha"><span class="erro"></span></div>
  <p id="msg" class="msg" role="alert"></p>
  <button type="submit" style="width:100%">Entrar</button>
</form>
<script src="js/validacoes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
