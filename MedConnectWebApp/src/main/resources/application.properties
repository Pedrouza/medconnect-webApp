# Banco de dados (MySQL). Defina DB_USER e DB_PASSWORD como variáveis de ambiente, se necessário.
spring.datasource.url=jdbc:mysql://localhost:3306/medconnect_web?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Usuário do sistema (login)
medconnect.admin.email=admin@medconnect.com
medconnect.admin.senha=admin123
